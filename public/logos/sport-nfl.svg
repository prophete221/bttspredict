<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="NFL">
  <defs>
    <radialGradient id="nfl-ball-grad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="60%" stop-color="#654321"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </radialGradient>
    <filter id="nfl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Football shape (prolate spheroid) -->
  <ellipse cx="40" cy="40" rx="34" ry="20" fill="url(#nfl-ball-grad)" filter="url(#nfl-shadow)" transform="rotate(-20 40 40)"/>
  <!-- White stripes -->
  <ellipse cx="28" cy="32" rx="3" ry="14" fill="#FFFFFF" opacity="0.9" transform="rotate(-20 28 32)"/>
  <ellipse cx="52" cy="48" rx="3" ry="14" fill="#FFFFFF" opacity="0.9" transform="rotate(-20 52 48)"/>
  <!-- Laces -->
  <g transform="rotate(-20 40 40)">
    <rect x="36" y="36" width="8" height="2" rx="1" fill="#FFFFFF"/>
    <rect x="37" y="34" width="1.5" height="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="39" y="34" width="1.5" height="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="41" y="34" width="1.5" height="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="37" y="38" width="1.5" height="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="39" y="38" width="1.5" height="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="41" y="38" width="1.5" height="2" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <!-- Highlight -->
  <ellipse cx="32" cy="28" rx="6" ry="3" fill="#FFFFFF" opacity="0.15" transform="rotate(-20 32 28)"/>
</svg>

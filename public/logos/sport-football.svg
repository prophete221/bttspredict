<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Football">
  <defs>
    <radialGradient id="ball-grad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#C8C8C8"/>
    </radialGradient>
    <filter id="ball-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="40" cy="40" r="36" fill="url(#ball-grad)" filter="url(#ball-shadow)"/>
  <circle cx="40" cy="40" r="36" fill="none" stroke="#999" stroke-width="0.5" opacity="0.3"/>
  <!-- Central pentagon -->
  <polygon points="40,18 52,27 47,41 33,41 28,27" fill="#1a1a1a"/>
  <!-- Top-left pentagon -->
  <polygon points="20,22 28,18 30,28 22,33 16,28" fill="#2a2a2a"/>
  <!-- Top-right pentagon -->
  <polygon points="60,22 52,18 50,28 58,33 64,28" fill="#2a2a2a"/>
  <!-- Bottom-left pentagon -->
  <polygon points="22,55 30,52 28,62 20,62 17,57" fill="#2a2a2a"/>
  <!-- Bottom-right pentagon -->
  <polygon points="58,55 50,52 52,62 60,62 63,57" fill="#2a2a2a"/>
  <!-- Connecting lines -->
  <line x1="40" y1="18" x2="40" y2="10" stroke="#444" stroke-width="1.5"/>
  <line x1="52" y1="27" x2="60" y2="22" stroke="#444" stroke-width="1.5"/>
  <line x1="28" y1="27" x2="20" y2="22" stroke="#444" stroke-width="1.5"/>
  <line x1="33" y1="41" x2="28" y2="52" stroke="#444" stroke-width="1.5"/>
  <line x1="47" y1="41" x2="52" y2="52" stroke="#444" stroke-width="1.5"/>
  <!-- Highlight -->
  <ellipse cx="30" cy="25" rx="8" ry="5" fill="#FFFFFF" opacity="0.3"/>
</svg>

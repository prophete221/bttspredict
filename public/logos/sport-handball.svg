<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Handball">
  <defs>
    <linearGradient id="hb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#006B85"/>
    </linearGradient>
    <radialGradient id="hb-glow" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#5EE6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#006B85" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#hb-grad)"/>
  <circle cx="32" cy="32" r="30" fill="url(#hb-glow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  <!-- Handball curve lines (similar to basketball but different color) -->
  <path d="M 4 32 Q 32 14 60 32" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
  <path d="M 4 32 Q 32 50 60 32" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
  <!-- Resin spots (handball characteristic) -->
  <circle cx="20" cy="22" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="44" cy="20" r="1.2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="38" cy="44" r="1.3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="22" cy="42" r="1" fill="#FFFFFF" opacity="0.4"/>
  <!-- Highlight -->
  <ellipse cx="22" cy="22" rx="6" ry="3" fill="#FFFFFF" opacity="0.25" transform="rotate(-30 22 22)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Tennis">
  <defs>
    <linearGradient id="tn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#D4A82C"/>
    </linearGradient>
    <radialGradient id="tn-glow" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#F5D77A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4A82C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#tn-grad)"/>
  <circle cx="32" cy="32" r="30" fill="url(#tn-glow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  <!-- Tennis ball curves -->
  <path d="M 4 32 Q 32 16 60 32" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
  <path d="M 4 32 Q 32 48 60 32" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
  <!-- Highlight -->
  <ellipse cx="22" cy="22" rx="6" ry="3" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 22 22)"/>
</svg>

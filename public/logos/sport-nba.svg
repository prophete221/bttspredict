<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="NBA Basketball">
  <defs>
    <radialGradient id="nba-grad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="60%" stop-color="#E85D04"/>
      <stop offset="100%" stop-color="#BC3908"/>
    </radialGradient>
    <filter id="nba-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="40" cy="40" r="36" fill="url(#nba-grad)" filter="url(#nba-shadow)"/>
  <!-- Curved lines (basketball seams) -->
  <path d="M40 4 Q40 40 40 76" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M4 40 Q40 40 76 40" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M10 18 Q40 40 10 62" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M70 18 Q40 40 70 62" stroke="#1a1a1a" stroke-width="2" fill="none"/>

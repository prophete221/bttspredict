<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Aviator">
  <defs>
    <linearGradient id="av-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EB5757"/>
      <stop offset="100%" stop-color="#7A1A1A"/>
    </linearGradient>
    <linearGradient id="av-trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C94C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F2C94C"/>
    </linearGradient>
    <radialGradient id="av-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#F47373" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#av-grad)"/>
  <circle cx="32" cy="32" r="30" fill="url(#av-glow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  <!-- Plane trail (curve going up) -->
  <path d="M 8 50 Q 22 36 32 22 L 50 14" fill="none" stroke="url(#av-trail)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Dots along trail -->
  <circle cx="14" cy="44" r="1.5" fill="#F2C94C" opacity="0.5"/>
  <circle cx="22" cy="34" r="1.5" fill="#F2C94C" opacity="0.7"/>
  <circle cx="32" cy="22" r="2" fill="#F2C94C"/>
  <!-- Plane (paper plane style) -->
  <g transform="translate(50,14) rotate(-30)">
    <polygon points="0,-6 12,0 0,6 4,0" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="0,-6 4,0 0,6" fill="#FFFFFF" opacity="0.6"/>
  </g>
  <!-- Multiplicator marker -->
  <text x="14" y="56" font-family="monospace" font-size="6" fill="#F2C94C" font-weight="700" opacity="0.7">x2.5</text>
</svg>

<!DOCTYPE html>
<html lang="fr-SN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — BTTSPredict</title>
  <meta name="description" content="La page demandée n'existe pas ou a été déplacée. Retour à l'accueil BTTSPredict.">
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0B1219;
      color: #AEB7BB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      box-sizing: border-box;
      width: min(calc(100% - 2rem), 480px);
      padding: clamp(1.5rem, 5vw, 2.25rem);
      border: 1px solid rgba(219, 230, 234, 0.13);
      border-radius: 16px;
      background: #111C26;
    }
    .code {
      display: inline-block;
      font-size: 4rem;
      font-weight: 800;
      color: #9ADBE3;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 {
      color: #F1EFE8;
      font-size: 1.5rem;
      margin: 0.5rem 0;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #AEB7BB;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      box-sizing: border-box;
      font-weight: 700;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .primary {
      background: #F1EFE8;
      color: #10181B;
    }
    .primary:hover {
      background: #E3E0D5;
    }
    .secondary {
      background: #17232E;
      color: #F1EFE8;
      border: 1px solid #3D5865;
    }
    .secondary:hover {
      background: rgba(154, 219, 227, 0.1);
    }
    @media (max-width: 420px) {
      .container { padding: 1.25rem; }
      .actions a { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="code">404</span>
    <h1>Match ou page introuvable</h1>
    <p>
      La page que vous cherchez n'existe pas, a expiré, ou le match n'est plus dans notre sélection du jour.
      Nos pronostics sont régénérés quotidiennement — les anciennes pages match ne sont plus servies.
    </p>
    <div class="actions">
      <a href="/" class="primary">Retour à l'accueil</a>
      <a href="/pronostics" class="secondary">Voir les pronostics du jour</a>
    </div>
  </div>
</body>
</html>

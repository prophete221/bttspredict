<!DOCTYPE html>
<html lang="fr-SN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — BTTSPredict</title>
  <meta name="description" content="La page demandée n'existe pas ou a été déplacée. Retour à l'accueil BTTSPredict.">
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A0B1A;
      color: #d1d5db;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2rem;
    }
    .code {
      display: inline-block;
      font-size: 4rem;
      font-weight: 800;
      color: #FACC15;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 {
      color: #F7F8FF;
      font-size: 1.5rem;
      margin: 0.5rem 0;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #A5ABC5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-weight: 700;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .primary {
      background: #5146F5;
      color: #F7F8FF;
    }
    .primary:hover {
      background: #6258FF;
    }
    .secondary {
      background: transparent;
      color: #F7F8FF;
      border: 1px solid #303861;
    }
    .secondary:hover {
      background: rgba(81, 70, 245, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="code">404</span>
    <h1>Match ou page introuvable</h1>
    <p>
      La page que vous cherchez n'existe pas, a expiré, ou le match n'est plus dans notre sélection du jour.
      Nos pronostics sont régénérés quotidiennement — les anciennes pages match ne sont plus servies.
    </p>
    <div class="actions">
      <a href="/" class="primary">Retour à l'accueil</a>
      <a href="/pronostics" class="secondary">Voir les pronostics du jour</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr-SN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page non trouvée — BttsBet</title>
  <meta http-equiv="refresh" content="5;url=/">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A0B1A;
      color: #d1d5db;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2rem;
    }
    h1 {
      color: #FACC15;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      background: #FACC15;
      color: #0A0B1A;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover {
      background: #eab308;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page non trouvée</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Vous allez être redirigé vers la page d'accueil automatiquement.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
  <script>
    // Fallback redirect if meta refresh doesn't work
    setTimeout(function() {
      window.location.href = '/';
    }, 5000);
  </script>
</body>
</html>

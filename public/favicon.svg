<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="100%" stop-color="#171A38"/>
    </linearGradient>
    <filter id="favGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>
  <g filter="url(#favGlow)" transform="translate(16 16) rotate(12) scale(0.7 1)">
    <line x1="-3" y1="-7" x2="-3" y2="7" stroke="#5146F5" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="3" y1="-7" x2="3" y2="7" stroke="#5146F5" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>

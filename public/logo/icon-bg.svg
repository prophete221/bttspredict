<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="100%" stop-color="#171A38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#5146F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5146F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- squircle background 512x512 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- subtle glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- // marks centered, scaled to ~10% of canvas -->
  <g filter="url(#softGlow)" transform="translate(256 256) rotate(12) scale(8 1)">
    <line x1="-2" y1="-60" x2="-2" y2="60" stroke="#5146F5" stroke-width="6" stroke-linecap="round"/>
    <line x1="6" y1="-60" x2="6" y2="60" stroke="#5146F5" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>

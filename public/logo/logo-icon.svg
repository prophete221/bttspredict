<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="100%" stop-color="#171A38"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- squircle background -->
  <path d="M12 0.5 C18.5 0.5 23.5 5.5 23.5 12 C23.5 18.5 18.5 23.5 12 23.5 C5.5 23.5 0.5 18.5 0.5 12 C0.5 5.5 5.5 0.5 12 0.5 Z" fill="url(#iconBg)"/>
  <!-- // marks -->
  <g filter="url(#glow)">
    <line x1="9" y1="6" x2="9" y2="18" stroke="#5146F5" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="15" y1="6" x2="15" y2="18" stroke="#5146F5" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

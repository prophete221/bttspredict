name: Daily Scraper & Deploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Try full scraper (with timeout fallback)
        id: full-scraper
        timeout-minutes: 10
        run: |
          timeout 600 node scripts/scraper.js || {
            echo "⚠️ Full scraper failed or timed out — switching to quick update"
            echo "scraper_failed=true" >> $GITHUB_OUTPUT
            node scripts/quick-update-predictions.mjs
          }
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Debug — show generated files
        run: |
          echo "=== predictions.json date ==="
          node -e "const d=require('./public/predictions.json');console.log('Date:',d.date,'Predictions:',d.predictions.length)"
          echo "=== win-history.json ==="
          node -e "const d=require('./public/win-history.json');console.log('Date:',d.date,'History:',d.history?.length||0)"

      - name: Build Next.js static export
        run: npm run build

      - name: Commit and push updated data
        run: |
          git config --local user.email "bot@bttsbet.online"
          git config --local user.name "BttsBet Bot"
          git add public/predictions.json public/win-history.json public/predictions-archive/
          git diff --staged --quiet || git commit -m "chore: update daily predictions & win history [skip ci]"
          git push || echo "⚠️ Git push failed — data already deployed"

      - name: Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/node_modules/**

name: Evening Results Update

on:
  schedule:
    # Run at 22:00 UTC = midnight Paris time (CET/CEST)
    # This captures evening matches that finished after the morning 06:00 UTC run
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update results only (V23 lightweight mode)
        run: node scripts/scraper.js --results-only
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Debug — show updated win-history
        run: |
          echo "=== win-history.json ==="
          cat public/win-history.json

      - name: Build Next.js static export
        run: npm run build

      - name: Commit and push updated results
        run: |
          git config --local user.email "bot@bttsbet.online"
          git config --local user.name "BttsBet Bot"
          git add public/win-history.json
          git diff --staged --quiet || git commit -m "chore: update evening win results [skip ci]"
          git push || echo "⚠️ Git push failed — data already deployed"

      - name: Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

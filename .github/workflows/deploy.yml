name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**'
  schedule:
    # Refresh every 3 h — the diff-based FTP upload (see ftp-diff.mjs) keeps each
    # run short, so completed matches are replaced promptly without overlap.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pronos+Gemini+build+FTP | code = build+FTP seulement (rapide)"
        required: false
        default: full
        type: choice
        options:
          - full
          - code
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Les runs durent 2 à 4 h (miroir FTP complet) alors que le cron passe toutes les
# 4 h : sans verrou, deux déploiements pouvaient se chevaucher (sessions FTP
# concurrentes, git push en échec avalé). On sérialise les runs.
concurrency:
  group: deploy-${{ github.ref }}
  # Un nouveau push/run annule l'ancien : un seul déploiement utile, pas de file.
  cancel-in-progress: true

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

  deploy:
    # Jamais de déploiement depuis une branche de travail ou un tag.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prune old predictions archives (keep 90)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/prune-archives.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: pip install google-genai

      - name: Enrichir les pronostics avec Gemini
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py
        continue-on-error: true

      - name: Finalize enriched immutable publication
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/finalize-predictions.mjs
      - name: Verify results (GOLD priority — free ESPN, no API key)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Verify public history exclusions applied
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: |
          node -e "
            const fs=require('fs');
            const wh=JSON.parse(fs.readFileSync('public/win-history.json','utf8'));
            const ex=JSON.parse(fs.readFileSync('public/history-exclusions.json','utf8'));
            const keys=new Set((ex.entries||[]).map(e=>e.key||e));
            const lost=wh.history.filter(h=>h.status==='LOST');
            const leaked=lost.filter(h=>keys.has(h.date+'|'+h.match+'|'+(h.market||'btts')));
            console.log('stats', wh.stats.total, wh.stats.won, wh.stats.lost, wh.stats.rate+'%');
            if (leaked.length) {
              console.error('FAIL: '+leaked.length+' LOST exclus encore dans history');
              process.exit(1);
            }
            console.log('OK exclusions respectées ('+keys.size+' clés)');
          "

      - name: Update transfers
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Run regression tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Update open licensed team context
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/update-team-context.mjs
        continue-on-error: true
      - name: Validate predictions dataset before build
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Commit data
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/history-exclusions.json public/transfers.json public/vip-combos.json public/predictions-archive/ 2>/dev/null || git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          if [ -f public/team-context.json ]; then git add public/team-context.json; fi
          if [ -d public/team-media ]; then git add public/team-media/; fi
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Install lftp (FTPS differential upload only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Déploiement LWS sur la branche de refonte :
      # - FTPS obligatoire et données chiffrées; bypass historique de vérification du certificat
      # - inventaire distant ACTUEL obligatoire (listing live) — un vieux manifeste ne suffit pas
      # - pas de suppression miroir, pas de purge récursive, pas d'upload complet de secours
      # - schéma manifeste v2 validé ; diff + calcul quota fichiers/octets avec marge
      # - manifeste distant publié UNIQUEMENT après transfert réussi
      # - pas d'étape .htaccess rm/rename (risque non contrôlé)
      - name: Deploy via FTPS (certificate bypass, live inventory, differential only)
        timeout-minutes: 45
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_FILE_QUOTA: '10000'
          FTP_FILE_MARGIN: '50'
          # Marge octets (50 Mio) sous 1 Go affiché panel — ajustable si LWS confirme autre plafond
          FTP_BYTE_QUOTA: '1000000000'
          FTP_BYTE_MARGIN: '52428800'
        run: |
          set -euo pipefail

          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Secrets FTP manquants — arrêt sans écriture distante."
            exit 1
          fi

          # Bypass historique du certificat, limité à cette refonte. FTPS reste obligatoire et protège aussi les données.
          SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify no; set net:timeout 60; set net:max-retries 3; set mirror:use-pget-n 1"
          FTP_URL="ftps://${FTP_SERVER}"

          ftp_run() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_URL" -e "$SETTINGS; $1; bye"
          }

          echo "FTPS chiffré requis; bypass historique de validation du certificat actif pour cette refonte."

          QUOTA="${FTP_FILE_QUOTA}"
          MARGIN="${FTP_FILE_MARGIN}"
          MAX_FILES=$((QUOTA - MARGIN))
          BYTE_QUOTA="${FTP_BYTE_QUOTA}"
          BYTE_MARGIN="${FTP_BYTE_MARGIN}"
          MAX_BYTES=$((BYTE_QUOTA - BYTE_MARGIN))

          # --- Inventaire distant ACTUEL (listing live) ---
          # Un manifeste historique ne prouve pas le quota actuel.
          rm -f out/remote-inventory.txt out/deploy-manifest.prev.json out/deploy-list.txt out/deploy-diff-stats.json
          echo "Inventaire distant live (find récursif, LIST classique, dotfiles inclus)…"
          INVENTORY_SETTINGS="$SETTINGS; set ftp:use-mlsd false; set ftp:list-options -a"
          set +e
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_URL" -e "$INVENTORY_SETTINGS; find .; bye" > out/remote-inventory.txt 2>out/remote-inventory.err
          LIST_RC=$?
          set -e
          if [ "$LIST_RC" -ne 0 ] || [ ! -s out/remote-inventory.txt ] || [ -s out/remote-inventory.err ]; then
            echo "::error::Inventaire LIST récursif absent, incomplet ou accompagné d'erreurs — arrêt avant sauvegarde ou écriture FTPS."
            if grep -Fqi 'max-retries exceeded' out/remote-inventory.err; then
              echo "::error::Diagnostic lftp: max-retries exceeded pendant find en LIST classique."
            elif [ "$LIST_RC" -ne 0 ]; then
              echo "::error::Diagnostic lftp: find en LIST classique a échoué (code $LIST_RC); détails bruts non affichés."
            else
              echo "::error::Diagnostic lftp: listing vide ou stderr non vide; résultat traité comme ambigu."
            fi
            exit 1
          fi

          # Compte des fichiers distants (lignes non-dossiers approximées : ignore entrées finissant par /)
          REMOTE_NOW=$(awk 'NF && !/\/$/ {n++} END {print n+0}' out/remote-inventory.txt)
          if [ "${REMOTE_NOW}" -le 0 ]; then
            echo "::error::Inventaire distant vide ou illisible — arrêt."
            exit 1
          fi
          DUPLICATE_PATHS=$(awk 'NF && !/\/$/ {print}' out/remote-inventory.txt | sort | uniq -d | wc -l)
          if [ "$DUPLICATE_PATHS" -gt 0 ]; then
            echo "::error::Inventaire distant ambigu: $DUPLICATE_PATHS chemins dupliqués — arrêt avant écriture."
            exit 1
          fi
          echo "Fichiers distants actuels (inventaire live): $REMOTE_NOW"

          # Manifeste distant optionnel pour le DIFF de contenu uniquement (pas pour le quota).
          if ftp_run "get ./deploy-manifest.json -o out/deploy-manifest.prev.json"; then
            echo "Manifeste distant récupéré (diff contenu)."
          else
            echo "::error::Manifeste distant deploy-manifest.json absent. Sans manifeste v2 valide, pas de diff sûr et pas d'upload complet. Arrêt."
            exit 1
          fi

          node scripts/ftp-diff.mjs prepare --require-prev --force-path=.htaccess --force-path=robots.txt --force-path=sitemap.xml

          if [ ! -f out/deploy-diff-stats.json ] || [ ! -f out/deploy-list.txt ]; then
            echo "::error::Statistiques de diff manquantes — arrêt."
            exit 1
          fi

          NEW_PATHS=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.newPathCount||0))")
          BYTES_TO_ADD=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.bytesToAdd||0))")
          CHANGED=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.changedCount||0))")
          LOCAL_BYTES=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.localTotalBytes||0))")

          echo "Diff: changed=$CHANGED newPaths=$NEW_PATHS bytesToAdd=$BYTES_TO_ADD localBytes=$LOCAL_BYTES"

          report_quota_candidates() {
            node -e "const s=require('./out/deploy-diff-stats.json'); for (const [k,label] of [['newPaths','nouveaux'],['changedPaths','modifiés']]) { const paths=s[k]||[]; console.log(label+' ('+paths.length+')'); console.log(paths.length ? paths.join('\\n') : '(aucun)'); }"
          }

          # Quota fichiers : inventaire live + chemins réellement nouveaux
          PROJECTED_FILES=$((REMOTE_NOW + NEW_PATHS))
          echo "Projection fichiers: $REMOTE_NOW + $NEW_PATHS = $PROJECTED_FILES (max autorisé $MAX_FILES / quota $QUOTA marge $MARGIN)"
          if [ "$PROJECTED_FILES" -gt "$MAX_FILES" ]; then
            echo "::error::Quota fichiers risqué ($PROJECTED_FILES > $MAX_FILES). Nettoyage panel LWS ou hausse de quota requis. Arrêt."
            report_quota_candidates
            exit 1
          fi

          # Quota octets : sans taille distante exacte par fichier, borne supérieure =
          # on refuse si bytesToAdd seul dépasse la marge restante sous BYTE_QUOTA
          # quand l'espace libre n'est pas mesurable. Exiger marge sur l'ajout.
          if [ "$BYTES_TO_ADD" -gt "$MAX_BYTES" ]; then
            echo "::error::Volume à ajouter ($BYTES_TO_ADD) dépasse la marge octets ($MAX_BYTES). Arrêt."
            report_quota_candidates
            exit 1
          fi
          # Si inventaire live montre déjà saturation fichiers, stop (déjà couvert).
          if [ "$REMOTE_NOW" -ge "$MAX_FILES" ]; then
            echo "::error::Serveur déjà au plafond fichiers ($REMOTE_NOW >= $MAX_FILES). Arrêt."
            report_quota_candidates
            exit 1
          fi

          if [ "$CHANGED" -eq 0 ]; then
            echo "Aucun fichier modifié — pas d'upload. Manifeste distant inchangé."
            exit 0
          fi

          # Sauvegarder les trois fichiers racine avant la première écriture distante.
          mkdir -p out/predeploy-backups
          for FILE in .htaccess robots.txt sitemap.xml; do
            if ! ftp_run "get ./$FILE -o out/predeploy-backups/$FILE"; then
              echo "::error::Impossible de sauvegarder le fichier distant $FILE — arrêt sans transfert."
              exit 1
            fi
            if [ ! -s "out/predeploy-backups/$FILE" ]; then
              echo "::error::La sauvegarde distante de $FILE est vide — arrêt sans transfert."
              exit 1
            fi
          done

          if ! ftp_run "mirror --reverse --no-perms --overwrite --verbose --parallel=2 --include-from-file=out/deploy-list.txt out/ ./"; then
            echo "::warning::Transfert différentiel FTPS échoué — restauration des fichiers racine sauvegardés."
            RESTORE_FAILED=0
            for FILE in .htaccess robots.txt sitemap.xml; do
              if ! ftp_run "put out/predeploy-backups/$FILE -o ./$FILE"; then
                RESTORE_FAILED=1
              fi
            done
            if [ "$RESTORE_FAILED" -ne 0 ]; then
              echo "::error::La restauration d'au moins un fichier racine a échoué; sauvegardes conservées dans les journaux de cette exécution."
            fi
            echo "::error::Transfert différentiel FTPS échoué — manifeste distant non modifié."
            exit 1
          fi

          if ! ftp_run "put out/deploy-manifest.json -o ./deploy-manifest.json"; then
            echo "::warning::Publication du manifeste v2 échouée — restauration des fichiers racine sauvegardés."
            RESTORE_FAILED=0
            for FILE in .htaccess robots.txt sitemap.xml; do
              if ! ftp_run "put out/predeploy-backups/$FILE -o ./$FILE"; then
                RESTORE_FAILED=1
              fi
            done
            if [ "$RESTORE_FAILED" -ne 0 ]; then
              echo "::error::La restauration d'au moins un fichier racine a échoué; sauvegardes conservées dans les journaux de cette exécution."
            fi
            echo "::error::Transfert OK mais publication du manifeste v2 échouée; fichiers racine restaurés si possible."
            exit 1
          fi
          echo "✓ Déploiement différentiel FTPS terminé; manifeste v2 distant mis à jour."

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true

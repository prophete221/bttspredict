name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**'
  schedule:
    # Refresh every 3 h — the diff-based FTP upload (see ftp-diff.mjs) keeps each
    # run short, so completed matches are replaced promptly without overlap.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pronos+Gemini+build+FTP | code = build+FTP | vip = génération privée des candidats uniquement"
        required: false
        default: full
        type: choice
        options:
          - full
          - code
          - vip
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Les déploiements publics sont sérialisés sans annulation : un nouveau run site
# attend le précédent. Le mode VIP-only a son propre groupe et évite la file FTP.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'vip' && 'vip-candidates-only' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

  vip-candidates-only:
    name: Private VIP candidate generation and approval sync
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'vip' && github.actor == github.repository_owner
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install Gemini client
        run: pip install google-genai==2.34.0

      - name: Run private VIP generator and Worker regression tests
        run: |
          npm test -- tests/vip-candidate-source.test.ts tests/vip-candidates-worker.test.ts
          python3 -m unittest discover -s tests -p 'enrich_vip_candidates_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Confirm private pipeline configuration without revealing values
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIP_CANDIDATE_API_URL: https://bttspredict-vip-production-api.luxxdii.workers.dev
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::GEMINI_API_KEY is not configured"; exit 1; }
          test -n "$VIP_CANDIDATE_API_URL" || { echo "::error::VIP_CANDIDATE_API_URL is not configured"; exit 1; }

      - name: Analyze VIP candidates privately
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        timeout-minutes: 10
        run: python scripts/enrich_vip_candidates.py

      - name: Build private candidate approval payload
        run: node scripts/vip-candidate-source.mjs .private/vip-gemini-candidates.json public/predictions.json .private/vip-candidates.json

      - name: Sync candidates to the private approval store
        env:
          VIP_CANDIDATE_API_URL: https://bttspredict-vip-production-api.luxxdii.workers.dev
        run: node scripts/sync-vip-candidates.mjs .private/vip-candidates.json

  deploy:
    # Jamais de déploiement depuis une branche de travail ou un tag.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'vip') && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require code-only marker for targeted history deploy
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[history-json]') && !contains(github.event.head_commit.message, '[code-only]') }}
        run: |
          echo "::error::[history-json] exige aussi [code-only] pour éviter tout rafraîchissement ou pruning des données."
          exit 1

      - name: Prune old predictions archives (keep 90)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        env:
          PRESERVE_EXISTING_ARCHIVES: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[preserve-archives]') }}
        run: node scripts/prune-archives.mjs

      - name: Verify existing prediction archives remain intact
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[preserve-archives]') && !contains(github.event.head_commit.message, '[code-only]') }}
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD -- public/predictions-archive/; then
            echo "::error::Une archive préexistante a changé après le pruning protecteur; arrêt avant les mises à jour Gemini et des données."
            git status --short -- public/predictions-archive/
            exit 1
          fi
          tracked_count="$(git ls-files -- 'public/predictions-archive/*.json' | wc -l | tr -d '[:space:]')"
          present_count="$(find public/predictions-archive -maxdepth 1 -type f -name '????-??-??.json' | wc -l | tr -d '[:space:]')"
          if [ "$tracked_count" -ne "$present_count" ]; then
            echo "::error::Inventaire d'archives différent : ${tracked_count} suivies, ${present_count} présentes; arrêt avant les mises à jour."
            exit 1
          fi
          echo "Inventaire protégé validé : ${tracked_count} archive(s) suivie(s), ${present_count} présente(s), aucun changement ni suppression."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate targeted history payload
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[history-json]') && contains(github.event.head_commit.message, '[code-only]') }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          const history = JSON.parse(fs.readFileSync('public/win-history.json', 'utf8'))
          const exclusions = JSON.parse(fs.readFileSync('public/history-exclusions.json', 'utf8'))
          const may5Lost = history.history.filter(row => row.date === '2026-11-05' && row.status === 'LOST')
          const nov7Lost = history.history.filter(row => row.date === '2026-11-07' && row.status === 'LOST')
          const exclusionKeys = (exclusions.entries || []).map(entry => typeof entry === 'string' ? entry : entry?.key).filter(key => typeof key === 'string')
          const may5Keys = exclusionKeys.filter(key => key.startsWith('2026-11-05|'))
          const nov7Keys = exclusionKeys.filter(key => key.startsWith('2026-11-07|'))
          const expectedStats = { total: 525, won: 424, lost: 101, unverifiable: 203, pending: 27, archivedTotal: 755 }
          if (may5Lost.length !== 0) throw new Error(`Il reste ${may5Lost.length} perte(s) du 2026-11-05 dans l’historique publié`)
          if (may5Keys.length !== 12 || new Set(may5Keys).size !== 12) throw new Error(`Les exclusions du 2026-11-05 ne correspondent pas aux 12 clés attendues (${may5Keys.length})`)
          if (nov7Lost.length !== 0) throw new Error(`Il reste ${nov7Lost.length} perte(s) du 2026-11-07 dans l’historique publié`)
          if (nov7Keys.length !== 15 || new Set(nov7Keys).size !== 15) throw new Error(`Les exclusions du 2026-11-07 ne correspondent pas aux 15 clés attendues (${nov7Keys.length})`)
          for (const [name, value] of Object.entries(expectedStats)) {
            if (history.stats?.[name] !== value) throw new Error(`Compteur history.stats.${name} inattendu: ${history.stats?.[name]} au lieu de ${value}`)
          }
          console.log('[history-json] payload validé: 12 clés du 2026-11-05 conservées; exactement 15 clés du 2026-11-07; 0 perte du jour; compteurs attendus.')
          JS

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: pip install google-genai==2.34.0

      - name: Gemini enrichment — warn on incomplete coverage
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py

      - name: Filter current feed to verified Gemini responses
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/filter-gemini-current-picks.mjs public/predictions.json

      - name: Analyze private VIP candidate variants (public feed unchanged)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        timeout-minutes: 5
        run: python scripts/enrich_vip_candidates.py

      - name: Generate private VIP candidate source (no publication)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/vip-candidate-source.mjs .private/vip-gemini-candidates.json public/predictions.json .private/vip-candidates.json

      - name: Sync private VIP candidates to durable approval store
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          VIP_CANDIDATE_API_URL: https://bttspredict-vip-production-api.luxxdii.workers.dev
        run: node scripts/sync-vip-candidates.mjs .private/vip-candidates.json

      - name: Finalize enriched immutable publication
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/finalize-predictions.mjs

      - name: Verify results (GOLD priority — free ESPN, no API key)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Verify public history exclusions applied
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: |
          node -e "
            const fs=require('fs');
            const wh=JSON.parse(fs.readFileSync('public/win-history.json','utf8'));
            const ex=JSON.parse(fs.readFileSync('public/history-exclusions.json','utf8'));
            const keys=new Set((ex.entries||[]).map(e=>e.key||e));
            const lost=wh.history.filter(h=>h.status==='LOST');
            const leaked=lost.filter(h=>keys.has(h.date+'|'+h.match+'|'+(h.market||'btts')));
            console.log('stats', wh.stats.total, wh.stats.won, wh.stats.lost, wh.stats.rate+'%');
            if (leaked.length) {
              console.error('FAIL: '+leaked.length+' LOST exclus encore dans history');
              process.exit(1);
            }
            console.log('OK exclusions respectées ('+keys.size+' clés)');
          "

      - name: Update transfers
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Run regression tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Update open licensed team context
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/update-team-context.mjs
        continue-on-error: true
      - name: Validate predictions dataset before build
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp --require-gemini

      - name: Build static export
        run: npm run build -- --webpack
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true

      # Le root layout unique pose lang="fr" sur les 3 langues ; le script
      # runtime client ne suffit pas aux crawlers. Correction post-export,
      # AVANT ftp-diff (les empreintes du manifeste portent sur les fichiers
      # corrigés). Aucun texte/URL/méta modifié ; RTL arabe posé sur <html>.
      - name: Fix html lang attributes (en/ar) before manifest
        run: node scripts/fix-html-lang.mjs out

      - name: Verify targeted history files in static export
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[history-json]') && contains(github.event.head_commit.message, '[code-only]') }}
        run: |
          cmp public/win-history.json out/win-history.json
          cmp public/history-exclusions.json out/history-exclusions.json

      - name: Commit data
        if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[code-only]')) && (github.event_name != 'workflow_dispatch' || inputs.mode != 'code') }}
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/history-exclusions.json public/transfers.json public/vip-combos.json public/predictions-archive/ 2>/dev/null || git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          if [ -f public/team-context.json ]; then git add public/team-context.json; fi
          if [ -d public/team-media ]; then git add public/team-media/; fi
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Generate local deployment manifest
        run: node scripts/ftp-diff.mjs manifest

      - name: Install lftp for targeted FTP preflight
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Prepare safe FTP state and targeted Match cleanup
        id: ftp-preflight
        timeout-minutes: 30
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CODE_ONLY_MODE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'code') }}
          HISTORY_JSON_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[history-json]') }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Secrets FTP manquants — arrêt sans écriture distante."
            exit 1
          fi
          mkdir -p out/predeploy-backups
          python3 -c 'from pathlib import Path; Path("out/deploy-manifest.prev.json").unlink(missing_ok=True)'
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "source scripts/ftp-safe-preflight.lftp" "ftp://${FTP_SERVER}"
          for FILE in robots.txt sitemap.xml; do
            if [ ! -s "out/predeploy-backups/$FILE" ]; then
              echo "::error::Sauvegarde distante absente ou vide : $FILE — arrêt."
              exit 1
            fi
          done
          for FILE in out/deploy-manifest.prev.json out/match-only-inventory.tsv out/stale-match-pages.json out/orphan-review.json out/sitemap-match-filter.json out/ftp-action-state-report.json out/deploy-manifest.json out/deploy-list.txt out/deploy-diff-stats.json out/deploy-upload-commands.lftp out/deploy-upload-plan.json; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Preuve de plan absente : $FILE — arrêt avant FTP-Deploy."
              exit 1
            fi
          done
          node -e "const p=require('./out/stale-match-pages.json'); if(!Array.isArray(p.deletions)||p.deletions.some(d=>! /^(en|ar)\\/match\\//.test(d.path))) process.exit(1); console.log('Suppression Match EN/AR validée:',p.deletionCount)"
          echo "Refroidissement 300 s pour la protection anti-flood LWS avant l’upload FTP différentiel…"
          sleep 300
          echo "Refroidissement LWS terminé; démarrage de l’action FTP différentielle."

      - name: Prepare validated upload allowlist
        id: ftp-allowlist
        env:
          CODE_ONLY_MODE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'code') }}
          HISTORY_JSON_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[history-json]') }}
        run: |
          set -euo pipefail
          if [ ! -s out/deploy-upload-commands.lftp ] || [ ! -s out/deploy-upload-plan.json ]; then
            echo "::error::Plan différentiel validé absent; arrêt avant upload."
            exit 1
          fi
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import { assertHistoryJsonOnlyPlan } from './scripts/prepare-ftp-upload-allowlist.mjs'
          const plan = JSON.parse(fs.readFileSync('out/deploy-upload-plan.json', 'utf8'))
          const stats = JSON.parse(fs.readFileSync('out/deploy-diff-stats.json', 'utf8'))
          const expectedCodeOnly = process.env.CODE_ONLY_MODE === 'true'
          const expectedHistoryJson = process.env.HISTORY_JSON_MODE === 'true'
          if (plan.codeOnly !== expectedCodeOnly || stats.codeOnlyMode !== expectedCodeOnly || plan.diffFileCount !== stats.changedCount || plan.remoteManifestUpdated !== !expectedCodeOnly || stats.remoteManifestMustNotBePublished !== expectedCodeOnly) {
            throw new Error('Le plan allowlist ne correspond pas au diff validé ou au mode code-only')
          }
          if (plan.historyJsonMode !== expectedHistoryJson || stats.historyJsonMode !== expectedHistoryJson) {
            throw new Error('Le plan allowlist ne correspond pas au mode history-json demandé')
          }
          if (expectedHistoryJson) {
            if (!expectedCodeOnly) throw new Error('Le mode history-json exige code-only')
            assertHistoryJsonOnlyPlan(plan, stats)
            const commandFile = fs.readFileSync('out/deploy-upload-commands.lftp', 'utf8')
            if (commandFile !== `${plan.commands.join('\n')}\n`) throw new Error('Le fichier de commandes FTP diffère du plan validé')
          }
          const protectedData = plan.uploadPaths.filter(p => /^(?:predictions|win-history|history-exclusions|transfers|vip-combos|team-context)\.json$/.test(p) || p.startsWith('predictions-archive/'))
          if (expectedCodeOnly && !expectedHistoryJson && protectedData.length) {
            throw new Error('Une donnée/archive est présente dans le transfert code-only')
          }
          if (expectedHistoryJson) console.log('[ftp-allowlist] JSON data autorisés exactement: history-exclusions.json, win-history.json; toutes les autres données restent exclues.')
          console.log(`[ftp-allowlist] diff=${plan.diffFileCount}; upload=${plan.uploadFileCount}; bytes=${plan.uploadBytes}; codeOnly=${plan.codeOnly}; historyJsonMode=${plan.historyJsonMode}`)
          JS

      - name: Deploy to bttspredict.com via FTP (validated allowlist, no delete)
        id: ftp-upload
        timeout-minutes: 180
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CODE_ONLY_MODE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[code-only]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'code') }}
        run: |
          set -euo pipefail
          if [ "$CODE_ONLY_MODE" = "true" ]; then
            echo "Manifeste distant laissé intact en mode code-only; les données exclues ne sont pas déclarées synchronisées."
          fi
          echo "Envoi différentiel par commandes put exactes (une par fichier), depuis le manifeste distant complet; aucune suppression générale."
          set +e
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "source out/deploy-upload-commands.lftp" "ftp://${FTP_SERVER}" 2>&1 | tee out/deploy-transfer.log
          FTP_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          node scripts/prepare-ftp-upload-allowlist.mjs report \
            --plan=out/deploy-upload-plan.json \
            --log=out/deploy-transfer.log \
            --ftp-exit-code="$FTP_EXIT_CODE" \
            --output=out/deploy-transfer-report.json
          if [ "$FTP_EXIT_CODE" -ne 0 ]; then
            echo "::error::Transfert FTP par allowlist en échec (code $FTP_EXIT_CODE)."
            exit "$FTP_EXIT_CODE"
          fi

      - name: Restore protected root files if FTP transfer did not complete
        if: ${{ always() && steps.ftp-preflight.outcome == 'success' && steps.ftp-upload.outcome != 'success' && steps.ftp-upload.outcome != 'skipped' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set ssl:verify no; set net:timeout 60; set net:max-retries 2; set cmd:fail-exit yes; put out/predeploy-backups/robots.txt -o robots.txt; put out/predeploy-backups/sitemap.xml -o sitemap.xml; bye" "ftp://${FTP_SERVER}"

      - name: Deploy .htaccess with historical temporary rename
        id: ftp-htaccess
        if: ${{ success() && steps.ftp-upload.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ssl:verify no; set net:timeout 60; set net:max-retries 3; rm -f ./.htaccess.deploy; put out/.htaccess -o ./.htaccess.deploy; rm -f ./.htaccess; mv ./.htaccess.deploy ./.htaccess; bye"; then
            echo "✓ .htaccess déployé (upload temporaire + rm + rename)"
          else
            echo "⚠️ rm+rename refusé — tentative STOR direct"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ssl:verify no; set net:timeout 60; set net:max-retries 3; put out/.htaccess -o ./.htaccess; bye" || echo "::warning::.htaccess non déployable via FTP."
          fi

      - name: Upload deploy evidence (full manifest base + Match-only inventory + diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-safe-plan-${{ github.run_id }}
          path: |
            out/match-only-inventory.tsv
            out/deploy-manifest.prev.json
            out/deploy-list.txt
            out/deploy-diff-stats.json
            out/stale-match-pages.json
            out/orphan-review.json
            out/sitemap-match-filter.json
            out/ftp-action-state-report.json
            out/deploy-manifest.json
            out/deploy-upload-commands.lftp
            out/deploy-upload-plan.json
            out/deploy-transfer.log
            out/deploy-transfer-report.json
          if-no-files-found: ignore
          retention-days: 15

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true

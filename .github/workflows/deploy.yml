name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Update data
        continue-on-error: true
        run: |
          node scripts/quick-update-predictions.mjs || true
          node scripts/update-win-history.mjs || true
          node scripts/scrape-transfers.mjs || true

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prepare
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "out/"
          server-dir: "/"
          exclude: |
            **/.git*
            **/node_modules/**

      - name: IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Copy files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "out/"
          server-dir: "/"
          exclude: |
            **/.git*
            **/node_modules/**

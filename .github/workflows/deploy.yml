name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
  schedule:
    # Refresh every 3 h — the diff-based FTP upload (see ftp-diff.mjs) keeps each
    # run short, so completed matches are replaced promptly without overlap.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pronos+Gemini+build+FTP | code = build+FTP seulement (rapide)"
        required: false
        default: full
        type: choice
        options:
          - full
          - code
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Les runs durent 2 à 4 h (miroir FTP complet) alors que le cron passe toutes les
# 4 h : sans verrou, deux déploiements pouvaient se chevaucher (sessions FTP
# concurrentes, git push en échec avalé). On sérialise les runs.
concurrency:
  group: deploy-${{ github.ref }}
  # Un nouveau push/run annule l'ancien : un seul déploiement utile, pas de file.
  cancel-in-progress: true

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

  deploy:
    # Jamais de déploiement depuis une branche de travail ou un tag.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prune old predictions archives (keep 90)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/prune-archives.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: pip install google-genai

      - name: Enrichir les pronostics avec Gemini
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py
        continue-on-error: true

      - name: Finalize enriched immutable publication
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/finalize-predictions.mjs
      - name: Verify results (GOLD priority — free ESPN, no API key)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Verify public history exclusions applied
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: |
          node -e "
            const fs=require('fs');
            const wh=JSON.parse(fs.readFileSync('public/win-history.json','utf8'));
            const ex=JSON.parse(fs.readFileSync('public/history-exclusions.json','utf8'));
            const keys=new Set((ex.entries||[]).map(e=>e.key||e));
            const lost=wh.history.filter(h=>h.status==='LOST');
            const leaked=lost.filter(h=>keys.has(h.date+'|'+h.match+'|'+(h.market||'btts')));
            console.log('stats', wh.stats.total, wh.stats.won, wh.stats.lost, wh.stats.rate+'%');
            if (leaked.length) {
              console.error('FAIL: '+leaked.length+' LOST exclus encore dans history');
              process.exit(1);
            }
            console.log('OK exclusions respectées ('+keys.size+' clés)');
          "

      - name: Update transfers
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Run regression tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Update open licensed team context
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/update-team-context.mjs
        continue-on-error: true
      - name: Validate predictions dataset before build
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Commit data
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/history-exclusions.json public/transfers.json public/vip-combos.json public/predictions-archive/ 2>/dev/null || git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          if [ -f public/team-context.json ]; then git add public/team-context.json; fi
          if [ -d public/team-media ]; then git add public/team-media/; fi
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Install lftp (FTPS differential upload only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Déploiement sûr LWS :
      # - FTPS explicite avec vérification TLS stricte (jamais de désactivation de la vérification TLS)
      # - pas de suppression miroir, pas de purge récursive, pas d'upload complet de secours
      # - manifeste sha256 local ; diff uniquement si manifeste distant récupérable
      # - arrêt immédiat si inventaire/manifeste distant inconnu ou quota fichiers risqué
      # - manifeste distant publié UNIQUEMENT après transfert réussi
      - name: Deploy via FTPS (strict TLS, differential only, quota gate)
        timeout-minutes: 45
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Plafond fichiers LWS observé (panel). Marge de sécurité obligatoire.
          FTP_FILE_QUOTA: '10000'
          FTP_FILE_MARGIN: '50'
        run: |
          set -euo pipefail

          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Secrets FTP manquants — arrêt sans écriture distante."
            exit 1
          fi

          # FTPS explicite + vérification certificat/hostname (vérification certificat obligatoire).
          SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:timeout 60; set net:max-retries 3; set mirror:use-pget-n 1"
          FTP_URL="ftps://${FTP_SERVER}"

          ftp_run() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_URL" -e "$SETTINGS; $1; bye"
          }

          # Préflight TLS strict sans login applicatif étendu : échec = stop.
          echo "Préflight FTPS strict vers hôte configuré…"
          if ! python3 scripts/check-ftp-tls.py --require-verified; then
            echo "::error::FTPS strict échoué (certificat/hostname). Demander à LWS un hôte dont le certificat couvre l'endpoint, ou corriger le certificat. Aucun déploiement."
            exit 1
          fi

          LOCAL_COUNT=$(find out -type f ! -name 'deploy-manifest.json' ! -name 'deploy-manifest.prev.json' ! -name 'deploy-list.txt' | wc -l | tr -d ' ')
          echo "Fichiers locaux (export): $LOCAL_COUNT"
          QUOTA="${FTP_FILE_QUOTA}"
          MARGIN="${FTP_FILE_MARGIN}"
          MAX_ALLOWED=$((QUOTA - MARGIN))
          if [ "$LOCAL_COUNT" -gt "$MAX_ALLOWED" ]; then
            echo "::error::Export local ($LOCAL_COUNT) dépasse quota-marge ($MAX_ALLOWED / quota $QUOTA). Arrêt."
            exit 1
          fi

          # Manifeste distant obligatoire pour un diff sûr. Absent → arrêt (pas de full upload).
          rm -f out/deploy-manifest.prev.json out/deploy-list.txt
          if ! ftp_run "get ./deploy-manifest.json -o out/deploy-manifest.prev.json"; then
            echo "::error::Manifeste distant deploy-manifest.json introuvable ou illisible. Inventaire non fiable — aucun transfert. Publier un manifeste initial hors bande après inventaire panel LWS."
            exit 1
          fi
          if [ ! -s out/deploy-manifest.prev.json ]; then
            echo "::error::Manifeste distant vide — arrêt."
            exit 1
          fi

          # Contrôle quota via fileCount du manifeste distant (proxy d'inventaire versionné).
          REMOTE_COUNT=$(node -e "const m=require('./out/deploy-manifest.prev.json'); if(typeof m.fileCount!=='number') process.exit(2); process.stdout.write(String(m.fileCount))") || {
            echo "::error::Manifeste distant sans fileCount numérique — inventaire non fiable, arrêt."
            exit 1
          }
          echo "Fichiers déclarés manifeste distant: $REMOTE_COUNT"

          # Diff strict : seulement hash changés / nouveaux. Échec si prepare refuse.
          node scripts/ftp-diff.mjs prepare --require-prev
          if [ ! -f out/deploy-list.txt ]; then
            echo "::error::deploy-list.txt manquant après prepare — arrêt."
            exit 1
          fi

          CHANGED=$(grep -c . out/deploy-list.txt || true)
          echo "Fichiers à transférer (diff): $CHANGED"

          # Borne haute grossière : remote + ajouts (sans suppressions distantes automatiques).
          # Sans inventaire live exact, on refuse si remote déjà >= MAX_ALLOWED.
          if [ "$REMOTE_COUNT" -ge "$MAX_ALLOWED" ]; then
            echo "::error::Quota distant saturé ($REMOTE_COUNT >= $MAX_ALLOWED). Nettoyage manuel panel LWS requis avant tout upload."
            exit 1
          fi

          if [ "$CHANGED" -eq 0 ]; then
            echo "Aucun fichier modifié — pas d'upload. Manifeste distant inchangé."
            exit 0
          fi

          # Transfert différentiel uniquement — pas de suppression distante auto, pas de miroir complet.
          if ! ftp_run "mirror --reverse --no-perms --overwrite --verbose --parallel=2 --include-from-file=out/deploy-list.txt --exclude '^\\.htaccess\$' out/ ./"; then
            echo "::error::Transfert différentiel FTPS échoué — pas de repli complet, manifeste distant non modifié."
            exit 1
          fi

          # Manifeste publié seulement après succès du transfert.
          if ! ftp_run "put out/deploy-manifest.json -o ./deploy-manifest.json"; then
            echo "::error::Transfert OK mais publication du manifeste échouée — corriger avant le prochain run."
            exit 1
          fi
          echo "✓ Déploiement différentiel FTPS terminé; manifeste distant mis à jour."

      - name: Deploy .htaccess via FTPS (optional, no TLS bypass)
        continue-on-error: true
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:timeout 60; set net:max-retries 3"
          FTP_URL="ftps://${FTP_SERVER}"
          if [ ! -f out/.htaccess ]; then
            echo "Pas de out/.htaccess — skip"
            exit 0
          fi
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_URL" -e "
            $SETTINGS
            put out/.htaccess -o ./.htaccess.deploy
            rm -f ./.htaccess
            mv ./.htaccess.deploy ./.htaccess
            bye
          " || echo "::warning::.htaccess non déployé (droits LWS) — hors chemin critique du manifeste."

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true

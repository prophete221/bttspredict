name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # Refresh predictions six times daily so completed matches are replaced promptly.
    - cron: '0 */4 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        run: pip install google-genai

      - name: Enrichir les pronostics avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py
        continue-on-error: true

      - name: Generate VIP combos from verified bookmaker odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: Bet365,Unibet
        run: node scripts/update-vip-combos.mjs
        continue-on-error: true

      - name: Verify results (GOLD priority — free ESPN, no API key)
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Update transfers
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Validate predictions dataset before build
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Commit data
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Install lftp (for FTP cleanup)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Clean stale _next/ build dirs on server (via lftp)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          # Liste tous les _next/<dir>/ existants sur le serveur via FTP
          # puis ne conserve que ceux présents dans le build local.
          # Approche sûre : ne supprime rien si la liste échoue.

          # 1. Liste les dossiers _next/ distants
          REMOTE_DIRS=$(lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ssl:verify no
            set net:timeout 30
            set net:max-retries 2
            cd _next 2>/dev/null && cls -d || exit 0
            bye
          " 2>/dev/null || echo "")

          if [ -z "$REMOTE_DIRS" ]; then
            echo "⚠️ Impossible de lister _next/ sur le serveur — step ignoré"
            exit 0
          fi

          echo "📂 Dossiers _next/ distants détectés:"
          echo "$REMOTE_DIRS"

          # 2. Liste les dossiers _next/ locaux (build courant)
          LOCAL_DIRS=$(ls -1 out/_next/ 2>/dev/null | tr -d '/' || echo "")

          echo "📦 Dossiers _next/ locaux (build courant):"
          echo "$LOCAL_DIRS"

          # 3. Supprime les dossiers distants absents du build local
          #    (uniquement les dossiers à l'intérieur de _next/, jamais _next/static lui-même)
          while IFS= read -r remote_dir; do
            remote_dir=$(echo "$remote_dir" | xargs)
            [ -z "$remote_dir" ] && continue
            # Ne jamais supprimer _next/static (contient les chunks nommés, pas des buildIds)
            if [ "$remote_dir" = "static" ]; then
              continue
            fi
            # Vérifie si présent dans le build local
            if echo "$LOCAL_DIRS" | grep -qFx "$remote_dir"; then
              echo "✓ Conserve: _next/$remote_dir"
            else
              echo "🗑️  Supprime: _next/$remote_dir"
              lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
                set ssl:verify no
                set net:timeout 30
                set net:max-retries 1
                cd _next
                rm -rf $remote_dir 2>/dev/null || true
                bye
              " 2>/dev/null || true
            fi
          done <<< "$REMOTE_DIRS"

          echo "✓ Nettoyage terminé"
          exit 0

      - name: Deploy to bttspredict.com via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Synchronisation explicite du build statique vers la racine du site.
          # Sans --delete : aucun fichier distant non lié au build n'est supprimé.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ssl:verify no
            set net:timeout 30
            set net:max-retries 1
            set mirror:use-pget-n 4
            mirror --reverse --no-perms --overwrite --verbose --parallel=4 out/ ./
            bye
          "

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true

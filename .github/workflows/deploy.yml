name: Build & Deploy to bttspredict.com

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs
        continue-on-error: true

      - name: Update win history
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs
        continue-on-error: true

      - name: Update transfers
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true
          cp public/sitemap.xml out/sitemap.xml 2>/dev/null || true

      - name: Commit data
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/transfers.json public/predictions-archive/
          git diff --staged --quiet || git commit -m "chore: auto-update data [skip ci]"
          git push || echo "No changes"

      - name: Deploy to bttspredict.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**

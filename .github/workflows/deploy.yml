name: Build & Deploy to bttspredict.com

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**'
  schedule:
    # Refresh every 3 h — the diff-based FTP upload (see ftp-diff.mjs) keeps each
    # run short, so completed matches are replaced promptly without overlap.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pronos+Gemini+build+FTP | code = build+FTP seulement (rapide)"
        required: false
        default: full
        type: choice
        options:
          - full
          - code
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Les runs de premier déploiement après une refonte transfèrent la majorité des
# fichiers (plusieurs heures). Avec cancel-in-progress un cron qui passe toutes
# les 3 h tuait le transfert en cours — état distant partiel interdit. On
# sérialise donc sans annulation : un nouveau run attend la fin du précédent.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

  deploy:
    # Jamais de déploiement depuis une branche de travail ou un tag.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prune old predictions archives (keep 90)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/prune-archives.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Update predictions (ESPN API)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/quick-update-predictions.mjs

      - name: Validate fresh predictions before enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Setup Python for Gemini enrichment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-genai
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: pip install google-genai

      - name: Enrichir les pronostics avec Gemini
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 10
        run: python scripts/enrich_predictions.py
        continue-on-error: true

      - name: Finalize enriched immutable publication
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/finalize-predictions.mjs
      - name: Verify results (GOLD priority — free ESPN, no API key)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        id: verify
        timeout-minutes: 20
        run: node scripts/verify-results.mjs
        continue-on-error: true

      - name: Update win history (runs even if verify timed out)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 3
        run: node scripts/update-win-history.mjs

      - name: Verify public history exclusions applied
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: |
          node -e "
            const fs=require('fs');
            const wh=JSON.parse(fs.readFileSync('public/win-history.json','utf8'));
            const ex=JSON.parse(fs.readFileSync('public/history-exclusions.json','utf8'));
            const keys=new Set((ex.entries||[]).map(e=>e.key||e));
            const lost=wh.history.filter(h=>h.status==='LOST');
            const leaked=lost.filter(h=>keys.has(h.date+'|'+h.match+'|'+(h.market||'btts')));
            console.log('stats', wh.stats.total, wh.stats.won, wh.stats.lost, wh.stats.rate+'%');
            if (leaked.length) {
              console.error('FAIL: '+leaked.length+' LOST exclus encore dans history');
              process.exit(1);
            }
            console.log('OK exclusions respectées ('+keys.size+' clés)');
          "

      - name: Update transfers
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 2
        run: node scripts/scrape-transfers.mjs
        continue-on-error: true

      - name: Run regression tests
        run: npm test
      - name: Test narrative enrichment guards
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Update open licensed team context
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        timeout-minutes: 5
        run: node scripts/update-team-context.mjs
        continue-on-error: true
      - name: Validate predictions dataset before build
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'code') }}
        run: node scripts/validate-predictions.mjs public/predictions.json --require-timestamp

      - name: Build static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GA4 — définir la variable de dépôt "NEXT_PUBLIC_GA_ID"
          # (Settings > Secrets and variables > Actions > Variables).
          # Si absente, le build reste fonctionnel, sans tracking.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Copy routing files
        run: |
          cp public/404.html out/404.html 2>/dev/null || true
          cp out/index.html out/200.html 2>/dev/null || true
          cp public/_redirects out/_redirects 2>/dev/null || true
          cp public/.htaccess out/.htaccess 2>/dev/null || true
          cp public/robots.txt out/robots.txt 2>/dev/null || true

      # Le root layout unique pose lang="fr" sur les 3 langues ; le script
      # runtime client ne suffit pas aux crawlers. Correction post-export,
      # AVANT ftp-diff (les empreintes du manifeste portent sur les fichiers
      # corrigés). Aucun texte/URL/méta modifié ; RTL arabe posé sur <html>.
      - name: Fix html lang attributes (en/ar) before manifest
        run: node scripts/fix-html-lang.mjs out

      - name: Commit data
        continue-on-error: true
        run: |
          git config --local user.email "bot@bttspredict.com"
          git config --local user.name "BTTSPredict Bot"
          git add public/predictions.json public/win-history.json public/history-exclusions.json public/transfers.json public/vip-combos.json public/predictions-archive/ 2>/dev/null || git add public/predictions.json public/win-history.json public/transfers.json public/vip-combos.json public/predictions-archive/
          if [ -f public/team-context.json ]; then git add public/team-context.json; fi
          if [ -d public/team-media ]; then git add public/team-media/; fi
          git diff --staged --quiet || git commit -m "chore: auto-update data"
          git push || echo "No changes"

      - name: Install lftp (FTPS differential upload only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Déploiement LWS sur la branche de refonte :
      # - FTPS obligatoire et données chiffrées; bypass historique de vérification du certificat
      # - inventaire distant ACTUEL obligatoire (listing live) — un vieux manifeste ne suffit pas
      # - pas de suppression miroir, pas de purge récursive, pas d'upload complet de secours
      # - schéma manifeste v2 validé ; diff + calcul quota fichiers/octets avec marge
      # - manifeste distant publié UNIQUEMENT après transfert réussi
      # - pas d'étape .htaccess rm/rename (risque non contrôlé)
      - name: Deploy via FTPS (certificate bypass, live inventory, differential only)
        timeout-minutes: 300
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_FILE_QUOTA: '10000'
          FTP_FILE_MARGIN: '50'
          # Marge octets (50 Mio) sous 1 Go affiché panel — ajustable si LWS confirme autre plafond
          FTP_BYTE_QUOTA: '1000000000'
          FTP_BYTE_MARGIN: '52428800'
        run: |
          set -euo pipefail

          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::Secrets FTP manquants — arrêt sans écriture distante."
            exit 1
          fi

          # Bypass historique du certificat, limité à cette refonte. FTPS reste obligatoire et protège aussi les données.
          SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify no; set net:timeout 60; set net:max-retries 3; set cmd:fail-exit yes; set mirror:use-pget-n 1"
          FTP_URL="ftps://${FTP_SERVER}"

          ftp_run() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_URL" -e "$SETTINGS; $1; bye"
          }

          # LWS applique une protection anti-flood ENTRE les sessions et garde
          # une session zombie ouverte jusqu'à ~600 s sans QUIT propre (ProFTPD
          # TimeoutIdle). Le QUIT est désormais envoyé par l'outil d'inventaire
          # (finalize → drop_control); la pause anti-flood est juste avant transfert.
          # Chaque session FTPS reste retentée 3× (pause 60 s entre essais).
          ftp_run_retry() {
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if ftp_run "$1"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Session FTPS échouée (tentative $attempt/3) — pause de 60 s avant nouvel essai."
                sleep 60
              else
                echo "::warning::Session FTPS échouée à la dernière tentative; arrêt sans pause inutile."
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          cooldown() {
            echo "Refroidissement ${1}s (protection anti-flood LWS entre sessions)…"
            sleep "$1"
          }

          echo "FTPS chiffré requis; bypass historique de validation du certificat actif pour cette refonte."

          QUOTA="${FTP_FILE_QUOTA}"
          MARGIN="${FTP_FILE_MARGIN}"
          MAX_FILES=$((QUOTA - MARGIN))
          BYTE_QUOTA="${FTP_BYTE_QUOTA}"
          BYTE_MARGIN="${FTP_BYTE_MARGIN}"
          MAX_BYTES=$((BYTE_QUOTA - BYTE_MARGIN))

          # --- Inventaire distant ACTUEL (outil Python lecture seule) ---
          # L'inventaire récursif lftp précédent abandonnait tout le walk à la
          # première erreur de canal (run 41738042328 : max-retries exceeded). scripts/ftp-inventory.py
          # teste PWD/CWD/LIST/MLSD séparément, liste chaque répertoire avec
          # timeout + backoff + reconnexion contrôle, et journalise le chemin
          # exact des blocages. Les fichiers racine critiques sont aussi lus et
          # sauvegardés dans cette même session, sans ouverture lftp séparée.
          # Codes de sortie : 0 = complet ; 2 = partiel (aucun transfert) ; 1 = fatal.
          rm -f out/remote-inventory.tsv out/remote-inventory-summary.json out/remote-inventory-failures.json out/remote-inventory.err out/deploy-manifest.prev.json
          rm -rf out/predeploy-backups
          mkdir -p out/predeploy-backups
          set +e
          python3 scripts/ftp-inventory.py --mode=deploy --out-dir=out --timeout=30 --retries=2 --delay=0.05 --save-manifest=out/deploy-manifest.prev.json --save-root-backups=out/predeploy-backups
          INV_RC=$?
          set -e
          if [ "$INV_RC" -ne 0 ]; then
            echo "::error::Inventaire distant non fiable (code $INV_RC) — arrêt avant sauvegarde ou écriture FTPS. Chemins bloquants listés ci-dessus et dans l'artefact remote-inventory-failures.json."
            exit 1
          fi
          for FILE in .htaccess robots.txt sitemap.xml; do
            if [ ! -s "out/predeploy-backups/$FILE" ]; then
              echo "::error::La sauvegarde distante de $FILE est absente ou vide — arrêt sans transfert."
              exit 1
            fi
          done

          REMOTE_NOW=$(node -e "const s=require('./out/remote-inventory-summary.json'); process.stdout.write(String(s.filesCount||0))")
          REMOTE_BYTES=$(node -e "const s=require('./out/remote-inventory-summary.json'); process.stdout.write(String(s.bytesTotal||0))")
          DUPLICATE_PATHS=$(cut -f1 out/remote-inventory.tsv | sort | uniq -d | wc -l)
          if [ "${REMOTE_NOW}" -le 0 ]; then
            echo "::error::Inventaire distant vide ou illisible — arrêt."
            exit 1
          fi
          if [ "$DUPLICATE_PATHS" -gt 0 ]; then
            echo "::error::Inventaire distant ambigu: $DUPLICATE_PATHS chemins dupliqués — arrêt avant écriture."
            exit 1
          fi
          echo "Fichiers distants actuels (inventaire live): $REMOTE_NOW ($REMOTE_BYTES octets)"

          # Manifeste distant déjà lu pendant l'inventaire. Aucune session lftp
          # de repli: si la preuve est manquante ou invalide, on s'arrête.
          if [ ! -s out/deploy-manifest.prev.json ] || ! node -e "const m=require('./out/deploy-manifest.prev.json'); if(!m.files||typeof m.files!=='object'||m.fileCount!==Object.keys(m.files).length) process.exit(1)" 2>/dev/null; then
            echo "::error::Manifeste distant indisponible ou invalide dans l'inventaire Python. Pas de diff sûr ni de repli par upload complet. Arrêt."
            exit 1
          fi
          echo "Manifeste distant récupéré par l'inventaire Python (même session)."

          node scripts/ftp-diff.mjs prepare --require-prev --allow-legacy-v1 --live-inventory=out/remote-inventory.tsv --force-path=.htaccess --force-path=robots.txt --force-path=sitemap.xml

          if [ ! -f out/deploy-diff-stats.json ] || [ ! -f out/deploy-list.txt ]; then
            echo "::error::Statistiques de diff manquantes — arrêt."
            exit 1
          fi

          node --experimental-strip-types scripts/prepare-stale-match-deletions.mjs \
            --inventory=out/remote-inventory.tsv \
            --current-manifest=out/deploy-manifest.json \
            --output=out/stale-match-pages.json \
            --review=out/orphan-review.json \
            --delete-commands=out/stale-match-delete.lftp

          # Le sitemap du build fournit les versions actuelles; on conserve les
          # autres URL distantes et retire uniquement celles des fichiers Match
          # réellement supprimés par le plan ci-dessus.
          node --experimental-strip-types scripts/filter-sitemap-match-urls.mjs \
            --input=out/sitemap.xml \
            --previous=out/predeploy-backups/sitemap.xml \
            --deletions=out/stale-match-pages.json \
            --current-manifest=out/deploy-manifest.json \
            --output=out/sitemap.xml \
            --report=out/sitemap-match-filter.json \
            --public-dir=public

          # Le manifeste et le diff doivent refléter le sitemap filtré, pas le
          # sitemap généré par Next avant la suppression ciblée des anciennes URL.
          node scripts/ftp-diff.mjs prepare --require-prev --allow-legacy-v1 --live-inventory=out/remote-inventory.tsv --force-path=.htaccess --force-path=robots.txt --force-path=sitemap.xml
          if [ ! -f out/deploy-diff-stats.json ] || [ ! -f out/deploy-list.txt ]; then
            echo "::error::Statistiques de diff final manquantes — arrêt."
            exit 1
          fi

          NEW_PATHS=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.newPathCount||0))")
          BYTES_TO_ADD=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.bytesToAdd||0))")
          CHANGED=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.changedCount||0))")
          LOCAL_BYTES=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.localTotalBytes||0))")
          MISSING=$(node -e "const s=require('./out/deploy-diff-stats.json'); process.stdout.write(String(s.missingOnRemoteCount||0))")
          MATCH_DELETE_COUNT=$(node -e "const s=require('./out/stale-match-pages.json'); process.stdout.write(String(s.deletionCount||0))")
          MATCH_DELETE_BYTES=$(node -e "const s=require('./out/stale-match-pages.json'); process.stdout.write(String(s.deletionBytes||0))")

          echo "Diff: changed=$CHANGED newPaths=$NEW_PATHS missingOnRemote=$MISSING bytesToAdd=$BYTES_TO_ADD localBytes=$LOCAL_BYTES"
          echo "Nettoyage Match strict: $MATCH_DELETE_COUNT pages passées, $MATCH_DELETE_BYTES octets"

          report_quota_candidates() {
            node -e "const s=require('./out/deploy-diff-stats.json'); for (const [k,label] of [['newPaths','nouveaux'],['changedPaths','modifiés']]) { const paths=s[k]||[]; console.log(label+' ('+paths.length+')'); console.log(paths.length ? paths.join('\\n') : '(aucun)'); }"
          }

          # Quota fichiers : inventaire live + chemins réellement nouveaux
          # + fichiers attendus mais absents du serveur (trous du diff par hash,
          # comptés par le croisement avec l'inventaire live).
          if [ "$MATCH_DELETE_COUNT" -gt "$REMOTE_NOW" ] || [ "$MATCH_DELETE_BYTES" -gt "$REMOTE_BYTES" ]; then
            echo "::error::Plan de nettoyage incohérent avec l'inventaire FTP — arrêt avant écriture."
            exit 1
          fi
          REMOTE_AFTER_MATCH_CLEANUP=$((REMOTE_NOW - MATCH_DELETE_COUNT))
          BYTES_AFTER_MATCH_CLEANUP=$((REMOTE_BYTES - MATCH_DELETE_BYTES))
          PROJECTED_FILES=$((REMOTE_AFTER_MATCH_CLEANUP + NEW_PATHS + MISSING))
          echo "Projection fichiers: ($REMOTE_NOW - $MATCH_DELETE_COUNT) + $NEW_PATHS + $MISSING = $PROJECTED_FILES (max autorisé $MAX_FILES / quota $QUOTA marge $MARGIN)"
          if [ "$PROJECTED_FILES" -gt "$MAX_FILES" ]; then
            echo "::error::Quota fichiers risqué ($PROJECTED_FILES > $MAX_FILES). Nettoyage panel LWS ou hausse de quota requis. Arrêt."
            report_quota_candidates
            exit 1
          fi

          # Quota octets : total distant MESURÉ par l'inventaire live + volume
          # à ajouter (remplacements comptés en pire cas où l'ancien fichier
          # ne serait pas libéré) ≤ plafond.
          PROJECTED_BYTES=$((BYTES_AFTER_MATCH_CLEANUP + BYTES_TO_ADD))
          echo "Projection octets: ($REMOTE_BYTES - $MATCH_DELETE_BYTES) + $BYTES_TO_ADD = $PROJECTED_BYTES (max autorisé $MAX_BYTES / quota $BYTE_QUOTA marge $BYTE_MARGIN)"
          if [ "$BYTES_TO_ADD" -gt "$MAX_BYTES" ]; then
            echo "::error::Volume à ajouter ($BYTES_TO_ADD) dépasse la marge octets ($MAX_BYTES). Arrêt."
            report_quota_candidates
            exit 1
          fi
          if [ "$PROJECTED_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::Quota octets risqué ($PROJECTED_BYTES > $MAX_BYTES). Nettoyage panel LWS requis. Arrêt."
            report_quota_candidates
            exit 1
          fi
          # Si inventaire live montre déjà saturation fichiers, stop (déjà couvert).
          if [ "$REMOTE_AFTER_MATCH_CLEANUP" -ge "$MAX_FILES" ]; then
            echo "::error::Serveur déjà au plafond fichiers après nettoyage Match ($REMOTE_AFTER_MATCH_CLEANUP >= $MAX_FILES). Arrêt."
            report_quota_candidates
            exit 1
          fi

          if [ "$CHANGED" -eq 0 ] && [ "$MATCH_DELETE_COUNT" -eq 0 ]; then
            echo "Aucun fichier modifié ni page Match passée à retirer — pas d'écriture FTP."
            exit 0
          fi

          # Pause anti-flood seulement si un transfert va ouvrir une nouvelle
          # session après le QUIT propre de l'inventaire.
          cooldown 300

          MIRROR_COMMAND="mirror --reverse --no-perms --overwrite --verbose --parallel=2 --include-from-file=out/deploy-list.txt out/ ./"
          if [ "$MATCH_DELETE_COUNT" -gt 0 ]; then
            REMOTE_UPDATE_COMMAND="source out/stale-match-delete.lftp"
            if [ "$CHANGED" -gt 0 ]; then
              REMOTE_UPDATE_COMMAND="$REMOTE_UPDATE_COMMAND; $MIRROR_COMMAND"
            fi
          else
            REMOTE_UPDATE_COMMAND="$MIRROR_COMMAND"
          fi
          if ! ftp_run_retry "$REMOTE_UPDATE_COMMAND"; then
            echo "::warning::Transfert différentiel FTPS échoué — restauration des fichiers racine sauvegardés."
            RESTORE_FAILED=0
            ftp_run_retry "put out/predeploy-backups/.htaccess -o ./.htaccess; put out/predeploy-backups/robots.txt -o ./robots.txt; put out/predeploy-backups/sitemap.xml -o ./sitemap.xml" || RESTORE_FAILED=1
            if [ "$RESTORE_FAILED" -ne 0 ]; then
              echo "::error::La restauration d'au moins un fichier racine a échoué; sauvegardes conservées dans les journaux de cette exécution."
            fi
            echo "::error::Transfert différentiel FTPS échoué — manifeste distant non modifié."
            exit 1
          fi

          cooldown 60

          if ! ftp_run_retry "put out/deploy-manifest.json -o ./deploy-manifest.json"; then
            echo "::warning::Publication du manifeste v2 échouée — restauration des fichiers racine sauvegardés."
            RESTORE_FAILED=0
            ftp_run_retry "put out/predeploy-backups/.htaccess -o ./.htaccess; put out/predeploy-backups/robots.txt -o ./robots.txt; put out/predeploy-backups/sitemap.xml -o ./sitemap.xml" || RESTORE_FAILED=1
            if [ "$RESTORE_FAILED" -ne 0 ]; then
              echo "::error::La restauration d'au moins un fichier racine a échoué; sauvegardes conservées dans les journaux de cette exécution."
            fi
            echo "::error::Transfert OK mais publication du manifeste v2 échouée; fichiers racine restaurés si possible."
            exit 1
          fi
          echo "✓ Déploiement différentiel FTPS terminé; manifeste v2 distant mis à jour."

      - name: Upload deploy evidence (inventory + diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-inventory-${{ github.run_id }}
          path: |
            out/remote-inventory.tsv
            out/remote-inventory-summary.json
            out/remote-inventory-failures.json
            out/remote-inventory.err
            out/deploy-diff-stats.json
            out/stale-match-pages.json
            out/orphan-review.json
            out/sitemap-match-filter.json
          if-no-files-found: ignore
          retention-days: 15

      - name: Notify Bing via IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
